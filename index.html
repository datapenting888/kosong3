<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Keep Clone</title>
    <style>
        :root {
            --bg-color: #202124;
            --card-bg: #202124;
            --card-border: #5f6368;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --accent-color: #fbbc04;
            --hover-bg: rgba(255, 255, 255, 0.039);
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Form Input Catatan Baru */
        .note-input-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 30px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.6), 0 2px 6px 2px rgba(0,0,0,0.3);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .note-input-container input,
        .note-input-container textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            resize: none;
            font-family: inherit;
            margin-bottom: 8px;
        }

        .note-input-container input {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .input-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 8px;
        }

        button {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background-color: var(--hover-bg);
        }

        .btn-close {
            color: var(--text-color);
        }

        /* Grid Catatan */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        /* Kartu Catatan */
        .note-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,0.3);
            transition: box-shadow 0.2s ease;
        }

        .note-card:hover {
            box-shadow: 0 1px 3px 1px rgba(0,0,0,0.5);
        }

        .note-card input.edit-title,
        .note-card textarea.edit-body {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: inherit;
            width: 100%;
            outline: none;
            resize: none;
        }

        .note-card input.edit-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .note-card textarea.edit-body {
            font-size: 0.95rem;
            min-height: 80px;
            color: var(--text-secondary);
        }

        /* Bagian Gambar didalam Kartu (seperti contoh) */
        .note-image {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        /* Styling Link otomatis */
        .note-link {
            color: #8ab4f8;
            text-decoration: underline;
            word-break: break-all;
            cursor: pointer;
        }
        .note-link:hover {
            color: #aecbfa;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }

        .save-status {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-delete {
            font-size: 0.8rem;
            color: #f28b82;
        }
        .btn-delete:hover {
            background-color: rgba(242, 139, 130, 0.1);
        }

        /* Notifikasi Toast untuk Copy Link */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Kotak Input Buat Catatan Baru -->
    <div class="note-input-container">
        <input type="text" id="inputTitle" placeholder="Judul">
        <textarea id="inputBody" placeholder="Buat catatan..." rows="2"></textarea>
        <input type="text" id="inputImage" placeholder="URL Gambar (Opsional, misal: https://...)" style="font-size: 0.85rem; color: var(--text-secondary);">
        <div class="input-footer">
            <button id="btnAddNote" class="btn-close">Selesai</button>
        </div>
    </div>

    <!-- Tempat Daftar Catatan Muncul -->
    <div class="notes-grid" id="notesGrid"></div>
</div>

<!-- Elemen Notifikasi Toast -->
<div id="toast">Link berhasil dicopy ke Clipboard!</div>

<script>
    // Inisialisasi data dari LocalStorage atau data default sesuai contoh gambar Anda
    let notes = JSON.parse(localStorage.getItem('keep_notes')) || [
        {
            id: 1,
            title: "PROFIL DANA",
            body: "https://ibb.co/HDpS2ZMg",
            image: "",
            updatedAt: "Baru saja"
        },
        {
            id: 2,
            title: "RRN DANA",
            body: "https://ibb.co/QWJpCzB",
            image: "",
            updatedAt: "Baru saja"
        }
    ];

    const notesGrid = document.getElementById('notesGrid');
    const inputTitle = document.getElementById('inputTitle');
    const inputBody = document.getElementById('inputBody');
    const inputImage = document.getElementById('inputImage');
    const btnAddNote = document.getElementById('btnAddNote');
    const toast = document.getElementById('toast');

    function showToast(message) {
        toast.textContent = message;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // Fungsi mengubah teks link mentah menjadi tag <a> yang bisa diklik + otomatis copy
    function formatLinks(text) {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return text.replace(urlRegex, function(url) {
            return `<a class="note-link" href="${url}" target="_blank" onclick="handleLinkClick(event, '${url}')">${url}</a>`;
        });
    }

    // Aksi saat link diklik: otomatis menyalin ke clipboard & membuka link
    window.handleLinkClick = function(event, url) {
        event.preventDefault(); // Mencegah langsung buka tab baru sebelum tercopy (opsional, atau biarkan terbuka)
        navigator.clipboard.writeText(url).then(() => {
            showToast(`Link disalin: ${url}`);
            // Buka link di tab baru setelah 0.5 detik agar user sempat melihat notifikasi copy
            setTimeout(() => {
                window.open(url, '_blank');
            }, 400);
        }).catch(err => {
            window.open(url, '_blank');
        });
    }

    // Render Catatan ke Layar
    function renderNotes() {
        notesGrid.innerHTML = '';
        notes.forEach((note, index) => {
            const card = document.createElement('div');
            card.className = 'note-card';

            // Render gambar jika ada
            let imageHtml = note.image ? `<img src="${note.image}" class="note-image" alt="Catatan Gambar">` : '';

            card.innerHTML = `
                <div>
                    ${imageHtml}
                    <input type="text" class="edit-title" value="${note.title}" data-index="${index}" placeholder="Judul">
                    <textarea class="edit-body" data-index="${index}" placeholder="Isi catatan...">${note.body}</textarea>
                </div>
                <div class="card-footer">
                    <span class="save-status" id="status-${index}">${note.updatedAt || 'Tersimpan'}</span>
                    <button class="btn-delete" onclick="deleteNote(${index})">Hapus</button>
                </div>
            `;
            notesGrid.appendChild(card);
        });

        // Tambahkan event listener untuk fitur "Auto-Save" (Simpan setiap ada perubahan)
        document.querySelectorAll('.edit-title, .edit-body').forEach(element => {
            element.addEventListener('input', (e) => {
                const index = e.target.getAttribute('data-index');
                const field = e.target.classList.contains('edit-title') ? 'title' : 'body';
                
                // Update data di array lokal
                notes[index][field] = e.target.value;
                notes[index][updatedAtText()] = "Menyimpan...";
                
                // Ubah status teks menjadi 'Menyimpan...'
                const statusEl = document.getElementById(`status-${index}`);
                if(statusEl) statusEl.textContent = "Menyimpan...";

                // Simpan otomatis ke LocalStorage dengan jeda (debounce)
                clearTimeout(window.saveTimeout);
                window.saveTimeout = setTimeout(() => {
                    saveToLocalStorage();
                    if(statusEl) statusEl.textContent = "Tersimpan otomatis";
                }, 500);
            });
        });
    }

    function updatedAtText() {
        const now = new Date();
        return 'updatedAt';
    }

    function saveToLocalStorage() {
        localStorage.setItem('keep_notes', JSON.stringify(notes));
    }

    // Tambah Catatan Baru dari Form Atas
    btnAddNote.addEventListener('click', () => {
        if (!inputTitle.value && !inputBody.value && !inputImage.value) return;

        notes.unshift({
            id: Date.now(),
            title: inputTitle.value,
            body: inputBody.value,
            image: inputImage.value,
            updatedAt: "Tersimpan"
        });

        saveToLocalStorage();
        renderNotes();

        // Reset input
        inputTitle.value = '';
        inputBody.value = '';
        inputImage.value = '';
    });

    // Hapus Catatan
    window.deleteNote = function(index) {
        notes.splice(index, 1);
        saveToLocalStorage();
        renderNotes();
    }

    // Render pertama kali saat halaman dimuat
    renderNotes();
</script>

</body>
</html>
