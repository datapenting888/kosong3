<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARIAN — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181f;
    --bg-deep: #0d1015;
    --surface: #1b212b;
    --surface-2: #212834;
    --border: #2b3340;
    --text: #eef2f6;
    --text-muted: #8994a3;
    --text-dim: #5c6674;
    --amber: #f0a83c;
    --amber-dim: #6b5027;
    --teal: #3ddbc4;
    --teal-dim: #1f4a44;
    --red: #e8637a;
    --radius: 10px;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', sans-serif;
    --display: 'Archivo', sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg-deep);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(240,168,60,0.06), transparent 40%),
      radial-gradient(circle at 85% 10%, rgba(61,219,196,0.05), transparent 45%);
    min-height: 100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index: 50;
    background: rgba(13,16,21,0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }
  .topbar-inner{
    max-width: 1180px; margin: 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width: 38px; height: 38px; border-radius: 9px;
    background: linear-gradient(155deg, var(--amber), #c97f1e);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--display); font-weight:900; font-size: 17px;
    color: #1a1305;
    box-shadow: 0 4px 14px rgba(240,168,60,0.25);
  }
  .brand-text h1{
    margin:0; font-family: var(--display); font-weight: 800;
    font-size: 18px; letter-spacing: 0.01em;
  }
  .brand-text span{
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase;
  }

  .clock-wrap{ display:flex; align-items:center; gap: 14px; }
  .flap-clock{ display:flex; gap:4px; }
  .flap{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: var(--mono); font-weight:700; font-size: 15px;
    color: var(--amber);
    width: 24px; height: 30px;
    display:flex; align-items:center; justify-content:center;
    position: relative; overflow:hidden;
  }
  .flap::after{
    content:''; position:absolute; left:0; right:0; top:50%;
    height:1px; background: rgba(0,0,0,0.4);
  }
  .clock-label{ font-size: 10px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.1em; }

  .refresh-btn{
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--sans); font-weight:600; font-size: 13px;
    padding: 9px 14px; border-radius: 8px; cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .refresh-btn:hover{ border-color: var(--amber); }
  .refresh-btn:active{ transform: scale(0.96); }
  .refresh-btn svg{ width:14px; height:14px; transition: transform .5s ease; }
  .refresh-btn.spinning svg{ animation: spin 0.7s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- Layout ---------- */
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 26px 20px 60px; }

  /* ---------- Stat cards ---------- */
  .stats-row{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card{
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    display:flex; flex-direction:column; gap: 6px;
    position: relative; overflow:hidden;
  }
  .stat-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background: var(--stat-accent, var(--amber));
  }
  .stat-label{
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); font-family: var(--sans); font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .stat-value{
    font-family: var(--display); font-weight: 800; font-size: 22px;
    color: var(--text); line-height:1;
  }
  .stat-sub{ font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background: var(--teal);
    box-shadow: 0 0 0 0 rgba(61,219,196,0.6);
    animation: pulse 1.8s infinite;
    display:inline-block;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(61,219,196,0.5); }
    70%{ box-shadow: 0 0 0 7px rgba(61,219,196,0); }
    100%{ box-shadow: 0 0 0 0 rgba(61,219,196,0); }
  }
  @media (max-width: 760px){
    .stats-row{ grid-template-columns: repeat(2, 1fr); }
  }

  .tabs{
    display:flex; gap: 6px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab{
    font-family: var(--display); font-weight:700; font-size: 13.5px;
    letter-spacing: 0.02em;
    padding: 11px 18px; cursor:pointer;
    color: var(--text-muted);
    border-bottom: 2.5px solid transparent;
    display:flex; align-items:center; gap:8px;
    transition: color .15s ease;
    user-select:none;
  }
  .tab .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--text-dim);
  }
  .tab.active{ color: var(--text); border-bottom-color: var(--amber); }
  .tab.active .dot{ background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .tab:hover:not(.active){ color: var(--text); }
  .tab .count{
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    background: var(--surface-2); padding: 1px 6px; border-radius: 10px;
  }

  .panel{ display:none; }
  .panel.active{ display:block; animation: fadeUp .35s ease; }
  @keyframes fadeUp{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .panel-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .search-box{
    position: relative; flex: 1; min-width: 200px; max-width: 320px;
  }
  .search-box input{
    width:100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px 9px 34px;
    color: var(--text); font-family: var(--sans); font-size: 13px;
    outline: none; transition: border-color .15s ease;
  }
  .search-box input:focus{ border-color: var(--teal); }
  .search-box svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; color: var(--text-dim);
  }
  .row-info{ font-size: 12px; color: var(--text-dim); font-family: var(--mono); }

  .table-shell{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-scroll{ overflow-x: auto; max-height: 62vh; overflow-y:auto; }
  table{ width:100%; border-collapse: collapse; font-size: 13px; }
  thead th{
    position: sticky; top:0; z-index:2;
    background: var(--surface-2);
    text-align:left; padding: 11px 14px;
    font-family: var(--display); font-weight:700; font-size: 11.5px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    cursor:pointer; white-space:nowrap; user-select:none;
  }
  thead th:hover{ color: var(--text); }
  thead th .arrow{ font-size:10px; margin-left:5px; color: var(--amber); opacity:0; }
  thead th.sorted .arrow{ opacity:1; }
  tbody td{
    padding: 10px 14px; border-bottom: 1px solid rgba(43,51,64,0.6);
    color: var(--text); font-family: var(--mono); font-size: 12.5px;
    white-space: nowrap;
  }
  tbody td.num{ text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.rownum{
    text-align:center; color: var(--text-dim); font-size: 11px;
    width: 38px; background: var(--surface-2);
  }
  th.rownum-head{ width: 38px; text-align:center; background: var(--surface-2); }
  tbody tr:nth-child(even){ background: rgba(255,255,255,0.012); }
  tbody tr{ transition: background .1s ease; }
  tbody tr:hover{ background: rgba(240,168,60,0.045); }
  tbody tr.today{ background: rgba(61,219,196,0.07); }
  tbody tr.today td:first-child{ box-shadow: inset 3px 0 0 var(--teal); }
  tbody tr:last-child td{ border-bottom:none; }

  .badge{
    display:inline-block; padding: 2px 9px; border-radius: 20px;
    font-size: 11px; font-weight:600; font-family: var(--sans);
  }
  .badge.win{ background: rgba(61,219,196,0.14); color: var(--teal); }
  .badge.lose{ background: rgba(232,99,122,0.14); color: var(--red); }
  .badge.neutral{ background: var(--surface-2); color: var(--text-muted); }

  .state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 12px; padding: 70px 20px; color: var(--text-dim);
  }
  .state svg{ width: 30px; height:30px; opacity:0.5; }
  .state.error{ color: var(--red); }
  .spinner{
    width: 26px; height:26px; border-radius:50%;
    border: 3px solid var(--border); border-top-color: var(--amber);
    animation: spin 0.8s linear infinite;
  }

  .footer-note{
    margin-top: 22px; font-size: 11.5px; color: var(--text-dim);
    text-align:center; font-family: var(--mono);
  }

  @media (max-width: 640px){
    .clock-wrap{ display:none; }
    .tabs{ overflow-x:auto; }
    thead th, tbody td{ padding: 9px 10px; }
  }

  ::selection{ background: var(--amber-dim); color: var(--text); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">H</div>
      <div class="brand-text">
        <h1>Harian Dashboard</h1>
        <span id="last-update-label">memuat…</span>
      </div>
    </div>
    <div class="clock-wrap">
      <div>
        <div class="clock-label">Update terakhir</div>
        <div class="flap-clock" id="flap-clock"></div>
      </div>
      <button class="refresh-btn" id="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        Refresh
      </button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="stats-row" id="stats-row"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="footer-note">Data diambil langsung dari Google Sheets · Auto-refresh setiap 5 menit</div>
</div>

<script>
/* ====================== KONFIGURASI ====================== */
/* Terhubung langsung ke spreadsheet aslinya via Google Sheets API v4 */
const SPREADSHEET_ID = "1KlWD9pye4vqIsxO6sv5XfyfO-e4CCSS6tcKqiP1DjY0";
const API_KEY = "AIzaSyBRNBQxfptX2-BF1gJ3eqVNMFi8ne63Qv0";
const SHEETS = ["RESULT", "DATA PENTING", "BOLAA"];
const AUTO_REFRESH_MINUTES = 5;
/* =========================================================== */

const state = {}; // { sheetName: { headers:[], rows:[[]], filtered:[], sortCol:null, sortDir:1, query:'' } }
let activeSheet = SHEETS[0];

function sheetsApiUrl(sheetName){
  // Nama sheet saja (tanpa batas range) = ambil seluruh baris & kolom yang terisi di sheet tsb
  return `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(sheetName)}?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING&key=${API_KEY}`;
}

/* ---------- Parsing respons Google Sheets API v4 ---------- */
function parseSheetsApiResponse(json){
  const values = json.values || [];
  if(values.length === 0) return { headers: [], rows: [] };

  const headerRow = values[0];
  const bodyRows = values.slice(1);
  const colCount = headerRow.length;

  const headers = headerRow.map((h, i) => (h && String(h).trim()) || `Kolom ${i + 1}`);

  // Google Sheets API memotong sel kosong di akhir baris — ratakan panjang tiap baris
  const rows = bodyRows.map(row => {
    const padded = row.slice(0, colCount);
    while(padded.length < colCount) padded.push("");
    return padded;
  });

  return { headers, rows };
}

async function fetchSheet(sheetName){
  const res = await fetch(sheetsApiUrl(sheetName));
  if(!res.ok){
    let detail = res.status;
    try{
      const errJson = await res.json();
      detail = errJson?.error?.message || detail;
    }catch(_){ /* abaikan, pakai status code */ }
    throw new Error(`Gagal ambil sheet "${sheetName}": ${detail}`);
  }
  const json = await res.json();
  return parseSheetsApiResponse(json);
}

/* ---------- UI: kartu statistik ---------- */
function renderStats(){
  const statsEl = document.getElementById("stats-row");
  const totalRows = SHEETS.reduce((sum, n) => sum + (state[n]?.rows?.length || 0), 0);
  const failedSheets = SHEETS.filter(n => state[n]?.error).length;
  const accents = ["var(--amber)", "var(--teal)", "#8a7cf0"];

  const cards = [
    {
      label: `<span class="live-dot"></span> Status`,
      value: failedSheets === 0 ? "Live" : `${failedSheets} Error`,
      sub: failedSheets === 0 ? "Terhubung ke Sheets API" : "Cek koneksi / API key",
      accent: failedSheets === 0 ? "var(--teal)" : "var(--red)"
    },
    { label: "Total Baris", value: totalRows.toLocaleString('id-ID'), sub: `dari ${SHEETS.length} sheet`, accent: accents[0] },
  ];
  SHEETS.forEach((name, i) => {
    cards.push({
      label: name,
      value: (state[name]?.rows?.length ?? 0).toLocaleString('id-ID'),
      sub: state[name]?.error ? "Gagal dimuat" : "baris data",
      accent: accents[(i+1) % accents.length]
    });
  });

  statsEl.innerHTML = cards.map(c => `
    <div class="stat-card" style="--stat-accent:${c.accent}">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-sub">${c.sub}</div>
    </div>
  `).join("");
}

/* ---------- UI: tabs ---------- */
function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  SHEETS.forEach(name => {
    const tab = document.createElement("div");
    tab.className = "tab" + (name === activeSheet ? " active" : "");
    tab.dataset.sheet = name;
    const count = state[name]?.rows?.length ?? "–";
    tab.innerHTML = `<span class="dot"></span>${name}<span class="count">${count}</span>`;
    tab.addEventListener("click", () => switchTab(name));
    tabsEl.appendChild(tab);
  });
}

function switchTab(name){
  activeSheet = name;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.sheet === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.dataset.sheet === name));
}

/* ---------- UI: panel per sheet ---------- */
function buildPanelShell(name){
  const panel = document.createElement("div");
  panel.className = "panel" + (name === activeSheet ? " active" : "");
  panel.dataset.sheet = name;
  panel.innerHTML = `
    <div class="panel-toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="Cari di ${name}…" data-search="${name}">
      </div>
      <div class="row-info" data-info="${name}"></div>
    </div>
    <div class="table-shell">
      <div class="table-scroll" data-scroll="${name}">
        <div class="state"><div class="spinner"></div>Memuat data…</div>
      </div>
    </div>
  `;
  return panel;
}

function renderTable(name){
  const s = state[name];
  const scrollEl = document.querySelector(`[data-scroll="${CSS.escape(name)}"]`);
  const infoEl = document.querySelector(`[data-info="${CSS.escape(name)}"]`);
  if(!s || !s.headers){
    scrollEl.innerHTML = `<div class="state error">Data tidak tersedia</div>`;
    return;
  }
  const rows = s.filtered;
  infoEl.textContent = `${rows.length} dari ${s.rows.length} baris`;

  if(rows.length === 0){
    scrollEl.innerHTML = `<div class="state">Tidak ada data yang cocok</div>`;
    return;
  }

  const todayStr = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric' }).replace(/\//g,'-');
  const dateColIdx = s.headers.findIndex(h => /tanggal|date|tgl/i.test(h));
  const numericCols = detectNumericColumns(s.rows, s.headers.length);

  let thead = "<tr><th class=\"rownum-head\">#</th>" + s.headers.map((h, i) => {
    const sorted = s.sortCol === i;
    const arrow = sorted ? (s.sortDir === 1 ? "▲" : "▼") : "▲";
    return `<th data-col="${i}" class="${sorted ? 'sorted' : ''}">${escapeHtml(h)}<span class="arrow">${arrow}</span></th>`;
  }).join("") + "</tr>";

  let tbody = rows.map((row, ri) => {
    let isToday = false;
    if(dateColIdx >= 0){
      const cellVal = String(row[dateColIdx] ?? "");
      if(cellVal.includes(todayStr) || cellVal === todayStr) isToday = true;
    }
    const tds = row.map((cell, ci) => `<td class="${numericCols[ci] ? 'num' : ''}">${formatCell(cell)}</td>`).join("");
    return `<tr class="${isToday ? 'today' : ''}"><td class="rownum">${ri + 1}</td>${tds}</tr>`;
  }).join("");

  scrollEl.innerHTML = `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;

  scrollEl.querySelectorAll("thead th").forEach(th => {
    th.addEventListener("click", () => {
      const col = parseInt(th.dataset.col, 10);
      if(s.sortCol === col){ s.sortDir *= -1; } else { s.sortCol = col; s.sortDir = 1; }
      s.filtered.sort((a,b) => compareVals(a[col], b[col]) * s.sortDir);
      renderTable(name);
    });
  });
}

function formatCell(val){
  const str = escapeHtml(String(val ?? ""));
  const lower = str.toLowerCase();
  if(["menang","win","ya","yes","valid"].includes(lower)) return `<span class="badge win">${str}</span>`;
  if(["kalah","lose","tidak","no","invalid"].includes(lower)) return `<span class="badge lose">${str}</span>`;
  return str;
}

function detectNumericColumns(rows, colCount){
  const flags = new Array(colCount).fill(false);
  const sample = rows.slice(0, 30);
  for(let c = 0; c < colCount; c++){
    let numCount = 0, filled = 0;
    sample.forEach(row => {
      const v = String(row[c] ?? "").trim();
      if(v === "") return;
      filled++;
      if(!isNaN(parseFloat(v)) && isFinite(v)) numCount++;
    });
    flags[c] = filled > 0 && numCount / filled > 0.8;
  }
  return flags;
}

function compareVals(a, b){
  const na = parseFloat(a), nb = parseFloat(b);
  if(!isNaN(na) && !isNaN(nb) && String(a).trim() !== "" && String(b).trim() !== "") return na - nb;
  return String(a ?? "").localeCompare(String(b ?? ""), 'id');
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function attachSearch(name){
  const input = document.querySelector(`[data-search="${CSS.escape(name)}"]`);
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    const s = state[name];
    s.query = q;
    s.filtered = q === ""
      ? s.rows.slice()
      : s.rows.filter(row => row.some(cell => String(cell ?? "").toLowerCase().includes(q)));
    if(s.sortCol !== null){ s.filtered.sort((a,b) => compareVals(a[s.sortCol], b[s.sortCol]) * s.sortDir); }
    renderTable(name);
  });
}

/* ---------- Flip clock ---------- */
function renderFlapClock(){
  const now = new Date();
  const parts = [
    String(now.getDate()).padStart(2,'0'),
    String(now.getMonth()+1).padStart(2,'0'),
    String(now.getHours()).padStart(2,'0'),
    String(now.getMinutes()).padStart(2,'0'),
  ];
  const clock = document.getElementById("flap-clock");
  clock.innerHTML = "";
  const chars = (parts[0] + parts[1] + "·" + parts[2] + parts[3]).split("");
  chars.forEach(ch => {
    const div = document.createElement("div");
    div.className = "flap";
    div.textContent = ch;
    if(ch === "·"){ div.style.background = "transparent"; div.style.border = "none"; div.style.color = "var(--text-dim)"; }
    clock.appendChild(div);
  });
  document.getElementById("last-update-label").textContent =
    now.toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}

/* ---------- Load semua sheet ---------- */
async function loadAll(){
  const btn = document.getElementById("refresh-btn");
  btn.classList.add("spinning");

  await Promise.all(SHEETS.map(async name => {
    try{
      const { headers, rows } = await fetchSheet(name);
      state[name] = { headers, rows, filtered: rows.slice(), sortCol: null, sortDir: 1, query: "" };
    }catch(err){
      console.error(`Gagal memuat sheet ${name}:`, err);
      state[name] = { headers:null, rows:[], filtered:[], error: err.message };
      const scrollEl = document.querySelector(`[data-scroll="${CSS.escape(name)}"]`);
      if(scrollEl){
        scrollEl.innerHTML = `<div class="state error">Gagal memuat data (${escapeHtml(err.message)})</div>`;
      }
    }
  }));

  buildTabs();
  renderStats();
  SHEETS.forEach(name => { if(state[name].headers) renderTable(name); });
  renderFlapClock();
  btn.classList.remove("spinning");
}

/* ---------- Init ---------- */
function init(){
  const panelsEl = document.getElementById("panels");
  SHEETS.forEach(name => panelsEl.appendChild(buildPanelShell(name)));
  SHEETS.forEach(name => attachSearch(name));
  buildTabs();

  document.getElementById("refresh-btn").addEventListener("click", loadAll);

  loadAll();
  setInterval(loadAll, AUTO_REFRESH_MINUTES * 60 * 1000);
  setInterval(renderFlapClock, 30 * 1000);
}

init();
</script>
</body>
</html>
